    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           UNITY CANVAS
           ===================================================== */

        #unity-canvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 100% !important;
            height: 100% !important;

            display: block;

        }


        /* =====================================================
           LOADING OVERLAY
           ===================================================== */

        #loading-overlay {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            padding: 12px;

            background: black;

            z-index: 9999;

            opacity: 1;

            transition:
                opacity 0.4s ease;

        }


        #loading-overlay.fade-out {

            opacity: 0;

            pointer-events: none;

        }


        /* =====================================================
           GAME AREA
           ===================================================== */

        #gameArea {

            position: relative;

            width: 100%;
            height: 100%;

            background: white;

            border-radius: 60px;

            overflow: hidden;

            touch-action: none;

            cursor: default;

        }


        /* =====================================================
           LOADING LOGO
           ===================================================== */

        #player {

            position: absolute;

            width: 50%;

            max-width: 500px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 10;

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;

            cursor: grab;

            animation:
                logoLoaderReveal
                0.8s
                infinite
                linear
                alternate,

                logoLoaderSpin
                1.6s
                infinite
                linear;

        }


        #player:active {

            cursor: grabbing;

        }


        /* =====================================================
           LOGO IMAGE
           ===================================================== */

        #player img {

            display: block;

            width: 100%;
            height: auto;

            filter: invert(1);

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;

            pointer-events: none;

        }


        /* =====================================================
           LOADING ANIMATION
           ===================================================== */

        @keyframes logoLoaderReveal {

            0% {

                clip-path: polygon(

                    50% 50%,

                    0 0,

                    50% 0%,

                    50% 0%,

                    50% 0%,

                    50% 0%,

                    50% 0%

                );

            }


            12.5% {

                clip-path: polygon(

                    50% 50%,

                    0 0,

                    50% 0%,

                    100% 0%,

                    100% 0%,

                    100% 0%,

                    100% 0%

                );

            }


            25% {

                clip-path: polygon(

                    50% 50%,

                    0 0,

                    50% 0%,

                    100% 0%,

                    100% 100%,

                    100% 100%,

                    100% 100%

                );

            }


            50% {

                clip-path: polygon(

                    50% 50%,

                    0 0,

                    50% 0%,

                    100% 0%,

                    100% 100%,

                    50% 100%,

                    0% 100%

                );

            }


            62.5% {

                clip-path: polygon(

                    50% 50%,

                    100% 0,

                    100% 0%,

                    100% 0%,

                    100% 100%,

                    50% 100%,

                    0% 100%

                );

            }


            75% {

                clip-path: polygon(

                    50% 50%,

                    100% 100%,

                    100% 100%,

                    100% 100%,

                    100% 100%,

                    50% 100%,

                    0% 100%

                );

            }


            100% {

                clip-path: polygon(

                    50% 50%,

                    50% 100%,

                    50% 100%,

                    50% 100%,

                    50% 100%,

                    50% 100%,

                    0% 100%

                );

            }

        }


        /* =====================================================
           LOADING ROTATION
           ===================================================== */

        @keyframes logoLoaderSpin {

            0% {

                transform:
                    translate(-50%, -50%)
                    scaleY(1)
                    rotate(0deg);

            }


            49.99% {

                transform:
                    translate(-50%, -50%)
                    scaleY(1)
                    rotate(135deg);

            }


            50% {

                transform:
                    translate(-50%, -50%)
                    scaleY(-1)
                    rotate(0deg);

            }


            100% {

                transform:
                    translate(-50%, -50%)
                    scaleY(-1)
                    rotate(-135deg);

            }

        }


        /* =====================================================
           GAME MODE PLAYER
           ===================================================== */

        #player.game-mode {

            width: 90px;

            max-width: none;

            left: 0;
            top: 0;

            animation: none;

            clip-path: none;

            cursor: grab;

        }


        #player.game-mode:active {

            cursor: grabbing;

        }


        /* =====================================================
           ENEMIES
           ===================================================== */

        .enemy {

            position: absolute;

            left: 0;
            top: 0;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: black;

            z-index: 5;

            pointer-events: none;

        }


        /* =====================================================
           SCORE
           ===================================================== */

        #score {

            position: absolute;

            top: 0;
            left: 50%;

            transform:
                translateX(-50%);

            min-width: 180px;

            padding: 18px 32px;

            background: black;

            color: white;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: 0.03em;

            text-align: center;

            white-space: nowrap;

            border-radius:
                0 0 32px 32px;

            z-index: 20;

            display: none;

            pointer-events: none;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #loading-overlay {

                padding: 8px;

            }


            #gameArea {

                border-radius: 35px;

            }


            #player:not(.game-mode) {

                width: 65%;

            }

        }


    </style>

</head>

    <script>


        /* =====================================================
           DOM
           ===================================================== */

        const loadingOverlay =
            document.getElementById(
                "loading-overlay"
            );


        const gameArea =
            document.getElementById(
                "gameArea"
            );


        const player =
            document.getElementById(
                "player"
            );


        const score =
            document.getElementById(
                "score"
            );


        /* =====================================================
           CONFIG
           ===================================================== */

        const CONFIG = {

            enemySize: 65,

            enemySpawnInterval: 1000,

            minSpeed: 1,

            maxSpeed: 3,

            playerSize: 90

        };


        /* =====================================================
           STATE
           ===================================================== */

        let gameRunning = false;

        let dragging = false;

        let enemies = [];

        let playerX = 0;

        let playerY = 0;

        let spawnTimer = null;

        let animationFrame = null;

        let areaRect = null;


        /* =====================================================
           RESIZE
           ===================================================== */

        function updateAreaSize() {

            areaRect =
                gameArea.getBoundingClientRect();

        }


        window.addEventListener(
            "resize",
            updateAreaSize
        );


        updateAreaSize();


        /* =====================================================
           CLAMP
           ===================================================== */

        function clamp(
            value,
            min,
            max
        ) {

            return Math.min(
                Math.max(value, min),
                max
            );

        }


        /* =====================================================
           PLAYER POSITION
           ===================================================== */

        function setPlayerPosition(
            x,
            y
        ) {

            playerX = x;

            playerY = y;


            player.style.transform =

                `translate(
                    ${x}px,
                    ${y}px
                )`;

        }


        /* =====================================================
           RANDOM SPEED
           ===================================================== */

        function randomSpeed() {

            const speed =

                CONFIG.minSpeed +

                Math.random() *

                (
                    CONFIG.maxSpeed -
                    CONFIG.minSpeed
                );


            return Math.random() > 0.5
                ? speed
                : -speed;

        }


        /* =====================================================
           SPAWN ENEMY
           ===================================================== */

        function spawnEnemy() {

            if (!gameRunning) {
                return;
            }


            const enemyElement =
                document.createElement(
                    "div"
                );


            enemyElement.className =
                "enemy";


            const maxX =
                Math.max(
                    0,
                    areaRect.width -
                    CONFIG.enemySize
                );


            const maxY =
                Math.max(
                    0,
                    areaRect.height -
                    CONFIG.enemySize
                );


            /*
                Start enemies near the
                top-center score area.
            */

            const x =
                clamp(

                    (
                        areaRect.width / 2
                    ) -

                    (
                        CONFIG.enemySize / 2
                    ),

                    0,

                    maxX

                );


            const y =
                clamp(

                    60,

                    0,

                    maxY

                );


            const enemy = {

                element:
                    enemyElement,

                x:
                    x,

                y:
                    y,

                vx:
                    randomSpeed(),

                vy:
                    randomSpeed()

            };


            enemyElement.style.transform =

                `translate(
                    ${enemy.x}px,
                    ${enemy.y}px
                )`;


            gameArea.appendChild(
                enemyElement
            );


            enemies.push(
                enemy
            );


            updateScore();

        }


        /* =====================================================
           SCORE
           ===================================================== */

        function updateScore() {

            score.textContent =
                `XP Dots: ${enemies.length}`;

        }


        /* =====================================================
           UPDATE ENEMIES
           ===================================================== */

        function updateEnemies() {

            const maxX =

                Math.max(

                    0,

                    areaRect.width -
                    CONFIG.enemySize

                );


            const maxY =

                Math.max(

                    0,

                    areaRect.height -
                    CONFIG.enemySize

                );


            for (
                const enemy of enemies
            ) {

                enemy.x +=
                    enemy.vx;


                enemy.y +=
                    enemy.vy;


                if (
                    enemy.x <= 0 ||
                    enemy.x >= maxX
                ) {

                    enemy.x =
                        clamp(
                            enemy.x,
                            0,
                            maxX
                        );


                    enemy.vx *= -1;

                }


                if (
                    enemy.y <= 0 ||
                    enemy.y >= maxY
                ) {

                    enemy.y =
                        clamp(
                            enemy.y,
                            0,
                            maxY
                        );


                    enemy.vy *= -1;

                }


                enemy.element.style.transform =

                    `translate(
                        ${enemy.x}px,
                        ${enemy.y}px
                    )`;

            }

        }


        /* =====================================================
           COLLISION
           ===================================================== */

        function checkCollision() {

            const playerCenterX =

                playerX +
                CONFIG.playerSize / 2;


            const playerCenterY =

                playerY +
                CONFIG.playerSize / 2;


            const collisionDistance =

                (
                    CONFIG.playerSize / 2
                ) +

                (
                    CONFIG.enemySize / 2
                );


            for (
                const enemy of enemies
            ) {

                const enemyCenterX =

                    enemy.x +
                    CONFIG.enemySize / 2;


                const enemyCenterY =

                    enemy.y +
                    CONFIG.enemySize / 2;


                const dx =

                    playerCenterX -
                    enemyCenterX;


                const dy =

                    playerCenterY -
                    enemyCenterY;


                if (

                    Math.hypot(
                        dx,
                        dy
                    ) <

                    collisionDistance

                ) {

                    return true;

                }

            }


            return false;

        }


        /* =====================================================
           CLEAR ENEMIES
           ===================================================== */

        function clearEnemies() {

            for (
                const enemy of enemies
            ) {

                enemy.element.remove();

            }


            enemies = [];

        }


        /* =====================================================
           END GAME
           ===================================================== */

        function endGame() {

            gameRunning = false;

            dragging = false;


            cancelAnimationFrame(
                animationFrame
            );


            clearTimeout(
                spawnTimer
            );

        /* =====================================================
           GAME LOOP
           ===================================================== */

        function gameLoop() {

            if (!gameRunning) {
                return;
            }


            updateEnemies();


            if (checkCollision()) {

                endGame();

                return;

            }


            animationFrame =

                requestAnimationFrame(
                    gameLoop
                );

        }


        /* =====================================================
           START GAME
           ===================================================== */

        function startGame(
            clientX,
            clientY
        ) {

            cancelAnimationFrame(
                animationFrame
            );


            clearTimeout(
                spawnTimer
            );


            clearEnemies();


            updateAreaSize();


            gameRunning = true;


            player.classList.add(
                "game-mode"
            );


            score.style.display =
                "block";


            /*
                Start player at the
                location that was clicked.
            */

            const x =

                clamp(

                    clientX -
                    areaRect.left -
                    CONFIG.playerSize / 2,

                    0,

                    Math.max(

                        0,

                        areaRect.width -
                        CONFIG.playerSize

                    )

                );


            const y =

                clamp(

                    clientY -
                    areaRect.top -
                    CONFIG.playerSize / 2,

                    0,

                    Math.max(

                        0,

                        areaRect.height -
                        CONFIG.playerSize

                    )

                );


            setPlayerPosition(
                x,
                y
            );


            /*
                Spawn first enemy immediately.
            */

            spawnEnemy();


            /*
                Continue spawning.
            */

            spawnTimer =

                setInterval(

                    spawnEnemy,

                    CONFIG.enemySpawnInterval

                );


            /*
                Start game loop.
            */

            animationFrame =

                requestAnimationFrame(
                    gameLoop
                );

        }


        /* =====================================================
           PLAYER HIT TEST
           ===================================================== */

        function playerContainsPoint(
            clientX,
            clientY
        ) {

            const rect =
                player.getBoundingClientRect();


            return (

                clientX >= rect.left &&

                clientX <= rect.right &&

                clientY >= rect.top &&

                clientY <= rect.bottom

            );

        }


        /* =====================================================
           MOVE PLAYER
           ===================================================== */

        function movePlayer(
            clientX,
            clientY
        ) {

            if (
                !gameRunning ||
                !dragging
            ) {

                return;

            }


            updateAreaSize();


            const x =

                clamp(

                    clientX -
                    areaRect.left -
                    CONFIG.playerSize / 2,

                    0,

                    Math.max(

                        0,

                        areaRect.width -
                        CONFIG.playerSize

                    )

                );


            const y =

                clamp(

                    clientY -
                    areaRect.top -
                    CONFIG.playerSize / 2,

                    0,

                    Math.max(

                        0,

                        areaRect.height -
                        CONFIG.playerSize

                    )

                );


            setPlayerPosition(
                x,
                y
            );

        }


        /* =====================================================
           POINTER DOWN
           ===================================================== */

        gameArea.addEventListener(

            "pointerdown",

            function(event) {

                /*
                    Game has not started.

                    Clicking anywhere starts
                    the game.
                */

                if (!gameRunning) {

                    startGame(

                        event.clientX,

                        event.clientY

                    );


                    dragging = true;


                    gameArea.setPointerCapture(
                        event.pointerId
                    );


                    return;

                }


                /*
                    Game is running.

                    Only the logo can be grabbed.
                */

                if (

                    !playerContainsPoint(

                        event.clientX,

                        event.clientY

                    )

                ) {

                    return;

                }


                dragging = true;


                gameArea.setPointerCapture(
                    event.pointerId
                );


                movePlayer(

                    event.clientX,

                    event.clientY

                );

            }

        );


        /* =====================================================
           POINTER MOVE
           ===================================================== */

        gameArea.addEventListener(

            "pointermove",

            function(event) {

                if (!dragging) {
                    return;
                }


                movePlayer(

                    event.clientX,

                    event.clientY

                );

            }

        );


        /* =====================================================
           POINTER UP
           ===================================================== */

        function stopDragging(event) {

            dragging = false;


            try {

                if (
                    gameArea.hasPointerCapture(
                        event.pointerId
                    )
                ) {

                    gameArea.releasePointerCapture(
                        event.pointerId
                    );

                }

            } catch (error) {

                /*
                    Ignore pointer-capture errors.
                */

            }

        }


        gameArea.addEventListener(
            "pointerup",
            stopDragging
        );


        gameArea.addEventListener(
            "pointercancel",
            stopDragging
        );


        /* =====================================================
           UNITY
           =====================================================

           This section intentionally matches
           your original working Unity setup.
           ===================================================== */

        createUnityInstance(

            document.querySelector(
                "#unity-canvas"
            ),

            {

                dataUrl:
                    "Build/e856865045c29e5902fb36bf4eca1c97.data.unityweb",

                frameworkUrl:
                    "Build/f82e072c18950d1ae011f1f387fbd233.framework.js.unityweb",

                codeUrl:
                    "Build/5e7b9f113a604515039f74881bdd1fe4.wasm.unityweb",

                streamingAssetsUrl:
                    "StreamingAssets",

                companyName:
                    "Gateway Adventure",

                productName:
                    "Gateway Adventure",

                productVersion:
                    "2026090500"

            }

        )

        .then(

            function() {

                /*
                    Unity is ready.

                    Stop the loading game.
                */

                gameRunning = false;

                dragging = false;


                cancelAnimationFrame(
                    animationFrame
                );


                clearTimeout(
                    spawnTimer
                );


                /*
                    Fade out loading screen.
                */

                loadingOverlay.classList.add(
                    "fade-out"
                );


                /*
                    Remove it completely.
                */

                setTimeout(

                    function() {

                        if (
                            loadingOverlay
                        ) {

                            loadingOverlay.remove();

                        }

                    },

                    450

                );

            }

        )

        .catch(

            function(message) {

                console.error(
                    "Unity failed to load:",
                    message
                );


                alert(
                    "Unity failed to load:\n\n" +
                    message
                );

            }

        );


    </script>
